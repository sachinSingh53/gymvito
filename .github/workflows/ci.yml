name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:migrations
      - run: pnpm validate:translations
      - run: pnpm validate:eas
      - run: pnpm scan:fixtures
      - run: pnpm test:ci
      - run: pnpm expo:doctor
      - run: pnpm expo export --platform android --output-dir dist
